name: "PR 557 navigation metadata baseline fix"

"on":
  push:
    branches:
      - codex/pr557-contract-fix-20261102

permissions:
  contents: write

jobs:
  refresh-baselines:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Update exact validated navigation baselines
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/versioning.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              '''    "latest": {
                  "groups": 5,
                  "pages": 99,
                  "removed": 4,
                  "scopedLinks": 0,
                  "treeSha256": "71220ececd45307411aa1479de9a3592f0bf7d2cfec42ec1e5310beac3a929bf",
              },''': '''    "latest": {
                  "groups": 5,
                  "pages": 100,
                  "removed": 4,
                  "scopedLinks": 0,
                  "treeSha256": "85f2f209301263b6d6b11eb752a35b68040bacdf814aa82799bc9ea9b3be32f3",
              },''',
              '''    "1.7": {
                  "groups": 5,
                  "pages": 85,
                  "removed": 12,
                  "scopedLinks": 10,
                  "treeSha256": "c87538b82b0e3506eef59417411686ddc188e0f33d0e3a1cda687de8d6f88747",
              },''': '''    "1.7": {
                  "groups": 5,
                  "pages": 85,
                  "removed": 13,
                  "scopedLinks": 10,
                  "treeSha256": "c87538b82b0e3506eef59417411686ddc188e0f33d0e3a1cda687de8d6f88747",
              },''',
              '''    "1.5": {
                  "groups": 5,
                  "pages": 77,
                  "removed": 20,
                  "scopedLinks": 10,
                  "treeSha256": "ac29ab8f0e7020496a3a1afe480687043d751e32c93ffb848e2210e3500cd483",
              },''': '''    "1.5": {
                  "groups": 5,
                  "pages": 77,
                  "removed": 21,
                  "scopedLinks": 10,
                  "treeSha256": "ac29ab8f0e7020496a3a1afe480687043d751e32c93ffb848e2210e3500cd483",
              },''',
              '''    "1.3": {
                  "groups": 5,
                  "pages": 68,
                  "removed": 29,
                  "scopedLinks": 10,
                  "treeSha256": "e8c9b0a64dac6dd3e47827ec5072697eb7d3ed79659e0b5c4a9c5df8e1408d38",
              },''': '''    "1.3": {
                  "groups": 5,
                  "pages": 68,
                  "removed": 30,
                  "scopedLinks": 10,
                  "treeSha256": "e8c9b0a64dac6dd3e47827ec5072697eb7d3ed79659e0b5c4a9c5df8e1408d38",
              },''',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one exact metadata block, got {count}: {old.splitlines()[0]}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY
          python3 -m py_compile scripts/versioning.py
          git diff --check

      - name: Commit validated baseline update and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr557-nav-metadata-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: refresh navigation validation baselines"
          git push origin HEAD:refs/heads/codex/pr557-contract-fix-20261102
