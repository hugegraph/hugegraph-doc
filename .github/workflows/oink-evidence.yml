name: OINK upgrade evidence (temporary)
on:
  push:
    branches: [codex/oink-1.4.0]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOWORK: "off"
      HUGO_MODULE_WORKSPACE: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.27.3"
      - uses: ./.github/actions/setup-site-tools
        with:
          hugo-version: "0.168.0"
      - name: Resolve official release locks and reviewed inventory
        run: |
          go get github.com/pgsty/oink@v1.4.0
          python3 - <<'PY'
          import json, pathlib, sys
          sys.path.insert(0, 'scripts')
          import update_oink
          root = pathlib.Path.cwd()
          update_oink.prune_checksums(root, 'v1.4.0')
          module = update_oink.download_locked(root)
          update_oink.verify_hugo_graph(root, 'v1.4.0')
          payload = {
              'goMod': (root / 'go.mod').read_text(),
              'goSum': (root / 'go.sum').read_text(),
              'baseline': {'version': 'v1.4.0', 'files': update_oink.snapshot(root, pathlib.Path(module['Dir']))}
          }
          print('OINK_METADATA_BEGIN')
          print(json.dumps(payload))
          print('OINK_METADATA_END')
          PY
      - name: Install output validators
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends webp
      - name: Build upgraded latest
        run: scripts/hugo.sh build --destination "$RUNNER_TEMP/oink-after-site"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: efa1d042316e3f18caef4a642a685f38d2ec596f
          path: .oink-before
          fetch-depth: 0
          persist-credentials: false
      - name: Install baseline's matching Sass toolchain
        uses: ./.oink-before/.github/actions/setup-site-tools
        with:
          hugo-version: "0.168.0"
          dart-sass-version: "1.105.2"
      - name: Build reviewed baseline
        working-directory: .oink-before
        run: scripts/hugo.sh build --destination "$RUNNER_TEMP/oink-before-site"
      - name: Install browser harness
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Capture comparable browser evidence
        working-directory: tests/e2e
        run: |
          node <<'JS'
          const { chromium } = require('@playwright/test');
          const { spawn } = require('node:child_process');
          const { mkdirSync, writeFileSync } = require('node:fs');
          (async () => {
            const servers = [];
            let browser;
            try {
              for (const [port, dir] of [[4173, 'oink-after-site'], [4176, 'oink-before-site']]) {
                servers.push(spawn('python3', ['serve.py', String(port), '--bind', '127.0.0.1', '--directory', process.env.RUNNER_TEMP + '/' + dir], {stdio:'ignore'}));
                for (let attempt = 0; attempt < 60; attempt++) {
                  try { if ((await fetch('http://127.0.0.1:' + port)).ok) break; } catch {}
                  await new Promise(resolve => setTimeout(resolve, 250));
                }
              }
              browser = await chromium.launch();
              const page = await browser.newPage({ viewport: {width:1440,height:900}, deviceScaleFactor:1 });
              mkdirSync('oink-evidence', {recursive:true});
              const shot = async (name, target = page) => {
                await page.evaluate(() => document.fonts.ready);
                const bytes = await target.screenshot({type:'jpeg',quality:80,animations:'disabled'});
                writeFileSync('oink-evidence/' + name + '.jpg', bytes);
                console.log('OINK_IMAGE_BEGIN ' + name);
                console.log(bytes.toString('base64'));
                console.log('OINK_IMAGE_END');
              };
              await page.goto('http://127.0.0.1:4176/cn/docs/introduction/', {waitUntil:'networkidle'});
              await shot('before-documentation');
              await page.goto('http://127.0.0.1:4173/cn/docs/introduction/', {waitUntil:'networkidle'});
              await shot('after-documentation');
              await page.locator('[data-td-appearance-trigger][aria-controls="td-appearance-navbar"]').click();
              if (await page.locator('#td-appearance-navbar [data-td-preset-value]').count() !== 4) throw new Error('Missing style');
              await shot('four-styles');
              for (const preset of ['ink', 'terminal']) {
                await page.locator('#td-appearance-navbar [data-td-preset-value="' + preset + '"]').locator('..').click();
                await page.keyboard.press('Escape');
                await shot(preset);
                await page.locator('[data-td-appearance-trigger][aria-controls="td-appearance-navbar"]').click();
              }
              await page.locator('#td-appearance-navbar [data-td-preset-value="slate"]').locator('..').click();
              await page.keyboard.press('Escape');
              await page.goto('http://127.0.0.1:4173/cn/docs/changelog/hugegraph-1.7.0-release-notes/', {waitUntil:'networkidle'});
              await shot('release-card', page.locator('.td-release-card'));
              await page.goto('http://127.0.0.1:4173/cn/docs/config/config-option/', {waitUntil:'networkidle'});
              await page.locator('[data-td-table-expand]').filter({hasText:'restserver.connection_max_requests'}).locator('.td-table-expand').click();
              await shot('table-reader');
              await page.keyboard.press('Escape');
              await page.locator('[data-td-shell-search-open]').first().click();
              await shot('search');
            } finally {
              if (browser) await browser.close();
              servers.forEach(server => server.kill());
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          JS
      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: oink-upgrade-evidence
          path: tests/e2e/oink-evidence
          if-no-files-found: ignore
      - name: Run source and link checks
        run: |
          bash dist/validate-links.sh
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
