name: Setup site tools
description: Install pinned standard Hugo for the native CSS theme
inputs:
  hugo-version:
    description: Exact Hugo version from toolchain.json
    required: true
runs:
  using: composite
  steps:
    - name: Setup Hugo
      uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
      with:
        hugo-version: ${{ inputs.hugo-version }}
        extended: false
