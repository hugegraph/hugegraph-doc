hero:
  title: One graph stack, from storage to AI.
  body: Apache HugeGraph covers graph database, graph computing and graph AI, with Gremlin and Cypher on top of distributed storage.
  primary:
    label: Get Started
    url: /docs/quickstart/
  secondary:
    label: GitHub
    url: https://github.com/apache/hugegraph
  explore: Explore the layers
  skip: Explore components

layers:
  ai:
    name: Graph AI
    components: hugegraph-llm, hugegraph-ml
    description: GraphRAG and knowledge graph construction with LLMs.
    url: /docs/quickstart/hugegraph-ai/
    go: Explore Graph AI
  computing:
    name: Graph Computing
    components: hugegraph-computer, Vermeer
    description: OLAP over the whole graph, in memory or on a BSP cluster.
    url: /docs/quickstart/computing/
    go: Explore Graph Computing
  database:
    name: Graph Database
    components: hugegraph-server
    description: Real-time OLTP queries through REST, Gremlin and Cypher.
    url: /docs/quickstart/hugegraph/hugegraph-server/
    go: Explore Graph Database
  storage:
    name: Distributed Storage
    components: hugegraph-pd, hugegraph-store
    description: PD places partitions; Store replicates them with Raft on RocksDB.
    url: /docs/quickstart/hugegraph/hugegraph-hstore/
    go: Explore Distributed Storage

story:
  label: HugeGraph, from one stack to every scale
  controls_label: Story layers
  stack_label: HugeGraph stack, four layers from storage to AI
  read_guide: Read the guide
  beats:
    database:
      title: Start with one vertex.
      body: A real-time graph database answers Gremlin and Cypher traversals in milliseconds.
      url: /docs/quickstart/hugegraph/hugegraph-server/
      link_label: Start with Server
    computing:
      title: Step back. Communities appear.
      body: Graph computing runs OLAP over the whole dataset, with Vermeer in memory and Computer on a BSP cluster.
      url: /docs/quickstart/computing/
      link_label: Explore graph computing
    storage:
      title: Keep going. Scale the graph.
      body: Hash partitions and Raft replicas spread vertices and edges across Store nodes as the graph grows.
      url: /docs/quickstart/hugegraph/hugegraph-hstore/
      link_label: Explore distributed storage
    ai:
      title: Then ask it a question.
      body: GraphRAG retrieves the subgraph that grounds an LLM answer, and the same toolkit builds knowledge graphs.
      url: /docs/quickstart/hugegraph-ai/
      link_label: Explore Graph AI
  readouts:
    database: "{vertices} vertices, 1 neighborhood"
    computing: "{vertices} vertices, {communities} communities"
    storage: Partitions and replicated storage
    ai: 1 question, 1 retrieved subgraph

capabilities:
  title: Everything a graph workload needs.
  items:
    - title: Convenient
      body: Gremlin, Cypher and a RESTful API, plus a complete toolchain for import, visualization and operations.
      icon: fa-solid fa-terminal
      url: /docs/quickstart/toolchain/
    - title: Efficient
      body: Batch import for massive datasets, millisecond-level retrieval and concurrent online operations for thousands of users.
      icon: fa-solid fa-bolt
      url: /docs/quickstart/toolchain/hugegraph-loader/
    - title: Adaptable
      body: Property graph modeling on Apache TinkerPop, covering OLTP and OLAP, with Hadoop and Spark integration.
      icon: fa-solid fa-arrow-right-arrow-left
      url: /docs/quickstart/computing/
    - title: AI-Ready
      body: GraphRAG, automated knowledge graph construction and 20+ built-in graph machine learning algorithms.
      icon: fa-solid fa-brain
      url: /docs/quickstart/hugegraph-ai/
    - title: Scalable
      body: Horizontal scaling and distributed deployment, from a standalone server to PB-level clusters.
      icon: fa-solid fa-up-right-and-down-left-from-center
      url: /docs/quickstart/hugegraph/hugegraph-hstore/
    - title: Open Ecosystem
      body: TinkerPop standards, multi-language clients and an active, evolving Apache community.
      icon: fa-solid fa-puzzle-piece
      url: /docs/clients/client/hugegraph-client/

components:
  title: One system, eight components.
  body: Run the server on its own, then add distributed storage, tooling, computing and AI as the graph grows.
  first_use: Start here
  groups:
    - title: Core
      items:
        - name: Server
          body: Core graph engine with REST API, Gremlin and Cypher.
          url: /docs/quickstart/hugegraph/hugegraph-server/
          first_use: true
        - name: PD
          body: Placement Driver for metadata, partitions and cluster scheduling.
          url: /docs/quickstart/hugegraph/hugegraph-pd/
        - name: Store
          body: Distributed storage with Raft consensus.
          url: /docs/quickstart/hugegraph/hugegraph-hstore/
    - title: Toolchain
      items:
        - name: Hubble
          body: Web platform for graph visualization.
          url: /docs/quickstart/toolchain/hugegraph-hubble/
        - name: Loader
          body: Data import tool for bulk loading.
          url: /docs/quickstart/toolchain/hugegraph-loader/
        - name: Tools
          body: Command-line utilities for backup, restore and migration.
          url: /docs/quickstart/toolchain/hugegraph-tools/
    - title: Computing and AI
      items:
        - name: Computer
          body: Distributed graph computing for OLAP workloads with a BSP runtime.
          url: /docs/quickstart/computing/hugegraph-computer/
        - name: AI
          body: GraphRAG and knowledge graph construction with LLMs.
          url: /docs/quickstart/hugegraph-ai/

quickstart:
  title: Running in one command.
  body: Start a single-node Server with Docker for testing or development, then reach the REST API on port 8080.
  command: docker run -itd --name=server -p 8080:8080 hugegraph/hugegraph:1.7.0
  copy: Copy
  copied: Copied
  copy_fallback: Copy selected command
  copy_status: Command copied to clipboard
  copy_fallback_status: Command selected; use your system copy command to copy it.
  verify: Check the startup logs, then verify the service is ready.
  verify_command: curl -fsS http://127.0.0.1:8080/versions
  next:
    label: Verify setup and run your first query
    url: /docs/quickstart/hugegraph/hugegraph-server/

community:
  title: The first Apache top-level graph system.
  body: Welcome to the HugeGraph open source community.
  items:
    - title: GitHub
      body: We work through pull requests on GitHub. New contributors are always welcome.
      url: https://github.com/apache/hugegraph
      icon: fa-brands fa-github
      external: true
    - title: ASF Slack
      body: Join the HugeGraph channel for community discussions.
      url: https://the-asf.slack.com/archives/C059UU2FJ23
      icon: fa-brands fa-slack
      external: true
    - title: Toolchain
      body: Graph loading, visualization, backup, restore and migration tools.
      url: /docs/quickstart/toolchain/
      icon: fa-solid fa-screwdriver-wrench
