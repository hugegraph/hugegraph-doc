<table {{- range $key, $value := .Attributes }}{{- if and $value (ne $key "caption") }}{{- printf " %s=%q" $key $value | safeHTMLAttr }}{{- end }}{{- end }}>
  {{ with .Attributes.caption }}<caption>{{ . | $.Page.RenderString }}</caption>{{ end }}
  <thead>
    {{ range .THead }}<tr>{{ range . }}<th{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{ .Text }}</th>{{ end }}</tr>{{ end }}
  </thead>
  <tbody>
    {{ range .TBody }}<tr>{{ range . }}<td{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{ .Text }}</td>{{ end }}</tr>{{ end }}
  </tbody>
</table>
